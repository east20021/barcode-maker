<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>탈락 바코드 생성기</title>
<style>
  :root { --bg:#0f1115; --card:#1a1e27; --line:#2a3040; --fg:#e8ecf4; --mut:#8a93a6; --ac:#4ea1ff; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { margin:0; background:var(--bg); color:var(--fg); font-family:-apple-system,"맑은 고딕",system-ui,sans-serif; }
  header { padding:14px 16px; font-weight:700; font-size:17px; border-bottom:1px solid var(--line); }
  header small { display:block; color:var(--mut); font-weight:400; font-size:12px; margin-top:2px; }
  .wrap { padding:16px; max-width:520px; margin:0 auto; }
  button { font:inherit; border:0; border-radius:12px; padding:14px 16px; width:100%; font-weight:700;
           background:var(--ac); color:#031024; margin-top:10px; }
  button.sub { background:var(--card); color:var(--fg); border:1px solid var(--line); font-weight:500; }
  .camwrap { position:relative; width:100%; border-radius:14px; overflow:hidden; background:#000; aspect-ratio:3/4; }
  video { width:100%; height:100%; object-fit:cover; display:block; }
  .guide { position:absolute; left:8%; right:8%; top:40%; height:20%; border:2px solid var(--ac);
           border-radius:10px; box-shadow:0 0 0 2000px rgba(0,0,0,.35); }
  .guide span { position:absolute; top:-22px; left:0; font-size:12px; color:var(--ac); }
  .eng { font-size:12px; margin:8px 2px; padding:8px 10px; border-radius:8px; background:var(--card); border:1px solid var(--line); }
  .eng.ok { color:#5bd98a; } .eng.load { color:#e0b04a; } .eng.err { color:#ff6b6b; }
  .status { color:var(--mut); font-size:13px; min-height:18px; margin:10px 2px; text-align:center; }
  .status.err { color:#ff6b6b; }
  .row { display:flex; gap:8px; align-items:center; margin:10px 0; }
  .row label { color:var(--mut); font-size:13px; }
  input[type=text], input[type=number] { background:var(--card); border:1px solid var(--line); color:var(--fg);
           border-radius:10px; padding:10px; font-size:16px; width:100%; }
  .num { font-size:24px; font-weight:800; letter-spacing:1px; text-align:center; }
  .codes { background:#fff; border-radius:14px; padding:18px; text-align:center; margin-top:12px; }
  .codes h4 { color:#333; margin:4px 0 8px; font-size:13px; }
  #qr { margin:0 auto 14px; }
  #barcode { max-width:100%; }
  .hide { display:none !important; }
  .toggle { display:flex; gap:6px; }
  .toggle button { margin:0; padding:8px; font-size:13px; }
  .toggle button.off { background:var(--card); color:var(--mut); border:1px solid var(--line); }
</style>
</head>
<body>
<header>📷 탈락 바코드 생성기 <small>v3 · PDA 번호 비추면 QR+바코드 생성 (인식은 폰 안에서)</small></header>
<div class="wrap">

  <!-- 엔진(OCR) 상태 -->
  <div id="engine" class="eng load">인식 엔진: 로딩 준비 중…</div>

  <!-- 설정 -->
  <div class="row">
    <label>인식 모드</label>
    <div class="toggle" style="flex:1">
      <button id="mNum" class="off" onclick="setMode('num')">숫자만</button>
      <button id="mAlnum" onclick="setMode('alnum')">영문+숫자</button>
    </div>
  </div>
  <div class="row">
    <label>최소 길이</label>
    <input type="number" id="minLen" value="4" min="1" style="width:80px">
    <label style="flex:1">자 이상 가장 긴 덩어리를 잡아요</label>
  </div>

  <!-- 카메라 -->
  <div id="camwrap" class="camwrap hide">
    <video id="video" playsinline muted></video>
    <div class="guide"><span>이 박스 안에 번호를 맞춰요</span></div>
  </div>

  <button id="startBtn" onclick="startCam()">카메라 시작</button>
  <button id="scanBtn" class="hide" onclick="scanOnce()">스캔 (탭)</button>
  <div class="row hide" id="autoRow">
    <label style="flex:1">자동 인식 (비추면 알아서)</label>
    <div class="toggle"><button id="autoOn" class="off" onclick="toggleAuto()">꺼짐</button></div>
  </div>

  <label class="sub" style="display:block;text-align:center;border:1px solid var(--line);border-radius:12px;padding:14px;margin-top:10px;color:var(--mut)">
    또는 사진 찍어서 인식
    <input type="file" accept="image/*" capture="environment" style="display:none" onchange="scanFile(this.files[0])">
  </label>

  <div class="status" id="status"></div>

  <!-- 결과 -->
  <div id="result" class="hide">
    <input type="text" id="numIn" class="num" oninput="makeCodes(this.value.trim())" placeholder="인식된 번호">
    <div class="codes">
      <h4>QR 코드</h4>
      <div id="qr" style="display:inline-block"></div>
      <h4>바코드 (CODE128)</h4>
      <svg id="barcode"></svg>
    </div>
    <button class="sub" onclick="copyNum()">번호 복사</button>
    <button class="sub" onclick="reset()">다시 스캔</button>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"></script>
<script src="https://cdn.jsdelivr.net/gh/davidshimjs/qrcodejs/qrcode.min.js"></script>
<script>
let worker=null, engineReady=false, stream=null, mode='alnum', autoTimer=null, lastSeen='';
const $=id=>document.getElementById(id);
const setStatus=(t,err)=>{ const s=$('status'); s.textContent=t; s.className='status'+(err?' err':''); };
const setEng=(t,cls)=>{ const e=$('engine'); e.textContent='인식 엔진: '+t; e.className='eng '+cls; };

function setMode(m){ mode=m;
  $('mNum').className = m==='num'?'':'off';
  $('mAlnum').className = m==='alnum'?'':'off';
  if(worker) worker.setParameters({ tessedit_char_whitelist: charset() });
}
const charset=()=> mode==='num' ? '0123456789' : '0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ-';

// 페이지 열리면 엔진을 미리 로딩 (카메라와 무관하게)
window.addEventListener('load', initEngine);
async function initEngine(){
  if(typeof Tesseract === 'undefined'){
    setEng('라이브러리 로드 실패 (인터넷/CDN 차단?). 데이터 연결 확인 후 새로고침', 'err'); return;
  }
  try{
    setEng('다운로드 중… (최초 1회, 20~30초)', 'load');
    worker = await Tesseract.createWorker('eng', 1, {
      logger: m => { if(m.status==='downloading'||m.progress!=null) setEng('준비 중 '+Math.round((m.progress||0)*100)+'%', 'load'); }
    });
    await worker.setParameters({ tessedit_char_whitelist: charset() });
    engineReady=true; setEng('준비됨 ✓', 'ok');
  }catch(e){
    setEng('로드 실패: '+(e&&e.message?e.message:e), 'err');
  }
}

async function startCam(){
  try{
    stream = await navigator.mediaDevices.getUserMedia({ video:{ facingMode:'environment' } });
    $('video').srcObject = stream; await $('video').play();
    $('camwrap').classList.remove('hide');
    $('startBtn').classList.add('hide');
    $('scanBtn').classList.remove('hide');
    $('autoRow').classList.remove('hide');
    setStatus('카메라 켜짐. 번호를 박스에 맞추고 "스캔"을 누르세요.');
  }catch(e){
    setStatus('카메라를 못 열었어요 ('+(e&&e.name?e.name:e)+'). HTTPS 주소인지/권한 허용을 확인하거나 아래 "사진 찍어서 인식"을 쓰세요.', true);
  }
}

function grabFrame(){
  const v=$('video'), vw=v.videoWidth, vh=v.videoHeight;
  if(!vw||!vh) return null;
  const bx=0.08*vw, bw=0.84*vw, by=0.40*vh, bh=0.20*vh;
  const sc=2;
  const c=document.createElement('canvas'); c.width=bw*sc; c.height=bh*sc;
  c.getContext('2d').drawImage(v, bx,by,bw,bh, 0,0, c.width,c.height);
  return c;
}

async function scanOnce(){
  if(!engineReady){ setStatus('인식 엔진이 아직 준비 중이에요 (위 "인식 엔진" 줄을 보세요). 준비됨 ✓ 뜨면 다시 눌러주세요.', true); return; }
  const frame=grabFrame();
  if(!frame){ setStatus('카메라가 아직 준비 안 됐어요. 잠깐 뒤 다시.', true); return; }
  setStatus('인식 중…');
  try{
    const { data } = await worker.recognize(frame);
    handleText(data.text);
  }catch(e){ setStatus('인식 오류: '+(e&&e.message?e.message:e), true); }
}

function toggleAuto(){
  if(!engineReady){ setStatus('엔진 준비 후에 자동 인식을 켤 수 있어요.', true); return; }
  if(autoTimer){ clearInterval(autoTimer); autoTimer=null; $('autoOn').textContent='꺼짐'; $('autoOn').className='off'; return; }
  $('autoOn').textContent='켜짐'; $('autoOn').className=''; lastSeen='';
  autoTimer=setInterval(async()=>{
    const frame=grabFrame(); if(!frame) return;
    let hit='';
    try{ const { data } = await worker.recognize(frame); hit=pick(data.text); }catch(e){ return; }
    setStatus(hit?('보임: '+hit):'번호를 찾는 중…');
    if(hit && hit===lastSeen){ clearInterval(autoTimer); autoTimer=null; $('autoOn').textContent='꺼짐'; $('autoOn').className='off'; show(hit); }
    lastSeen=hit;
  }, 1600);
}

async function scanFile(file){
  if(!file) return;
  if(!engineReady){ setStatus('인식 엔진이 아직 준비 중이에요. 준비됨 ✓ 뜨면 다시.', true); return; }
  setStatus('사진 인식 중…');
  const url=URL.createObjectURL(file);
  try{
    const { data } = await worker.recognize(url);
    handleText(data.text);
  }catch(e){ setStatus('인식 오류: '+(e&&e.message?e.message:e), true); }
  finally{ URL.revokeObjectURL(url); }
}

function pick(text){
  const min=Math.max(1, parseInt($('minLen').value)||1);
  const up=(text||'').toUpperCase();
  if(mode!=='num'){
    // 토트 바코드 우선: 하이픈으로 3토막 이상 끊긴 코드 (예: 78-RCRT9-2-102)
    const seg=(up.match(/[0-9A-Z]+(?:-[0-9A-Z]+){2,}/g)||[]);
    if(seg.length) return seg.sort((a,b)=>b.length-a.length)[0];
  }
  const re = mode==='num' ? /[0-9]+/g : /[0-9A-Z-]+/g;
  const toks=(up.match(re)||[]).map(t=>t.replace(/^-+|-+$/g,'')).filter(t=>t.replace(/-/g,'').length>=min);
  if(!toks.length) return '';
  return toks.sort((a,b)=>b.length-a.length)[0];
}
function handleText(text){
  const hit=pick(text);
  if(hit){ show(hit); }
  else { setStatus('번호를 못 찾았어요. 박스에 번호만 크게 맞춰 다시 스캔하세요. (읽힌 글자: '+(text||'').trim().replace(/\s+/g,' ').slice(0,40)+')', true); }
}
function show(v){ setStatus('인식됨: '+v); $('result').classList.remove('hide'); $('numIn').value=v; makeCodes(v); }

function makeCodes(v){
  if(!v) return;
  const qd=$('qr'); qd.innerHTML='';
  if(typeof QRCode!=='undefined'){ try{ new QRCode(qd, { text:v, width:200, height:200, correctLevel:QRCode.CorrectLevel.M }); }catch(e){} }
  if(typeof JsBarcode!=='undefined'){ try{ JsBarcode('#barcode', v, { format:'CODE128', displayValue:true, height:70, fontSize:16, margin:4 }); }catch(e){} }
}
function copyNum(){ const v=$('numIn').value.trim(); if(navigator.clipboard) navigator.clipboard.writeText(v); setStatus('복사됨: '+v); }
function reset(){ $('result').classList.add('hide'); lastSeen=''; setStatus(''); }
</script>
</body>
</html>

<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0f1115">
<title>코드 → QR/바코드</title>
<style>
  :root{ --bg:#0f1115; --card:#1a1e27; --line:#2a3040; --fg:#e8ecf4; --mut:#8a93a6; --ac:#4ea1ff; --ok:#5bd98a; --err:#ff6b6b; }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body{ margin:0; background:var(--bg); color:var(--fg); font-family:-apple-system,"맑은 고딕",system-ui,sans-serif;
        padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom); }
  header{ display:flex; align-items:center; gap:8px; padding:13px 16px; border-bottom:1px solid var(--line); }
  header b{ font-size:16px; } header .v{ color:var(--mut); font-size:11px; }
  .dot{ width:9px; height:9px; border-radius:50%; background:var(--mut); margin-left:auto; }
  .dot.ok{ background:var(--ok); box-shadow:0 0 8px var(--ok); } .dot.err{ background:var(--err); }
  .wrap{ max-width:520px; margin:0 auto; padding:16px; }
  label.cap{ display:block; color:var(--mut); font-size:13px; margin:2px 2px 6px; }
  #code{ width:100%; font-size:26px; font-weight:800; letter-spacing:1px; text-align:center; text-transform:uppercase;
         background:var(--card); border:2px solid var(--ac); color:var(--fg); border-radius:14px; padding:16px 10px; }
  #code::placeholder{ color:#5a6273; font-weight:500; letter-spacing:0; text-transform:none; font-size:17px; }
  button{ font:inherit; border:0; border-radius:14px; font-weight:800; background:var(--ac); color:#031024;
          padding:16px; width:100%; display:flex; align-items:center; justify-content:center; gap:8px; margin-top:12px; }
  button:active{ transform:scale(.98); }
  button.sub{ background:var(--card); color:var(--fg); border:1px solid var(--line); font-weight:600; }
  .pair{ display:flex; gap:10px; } .pair>*{ flex:1; }

  /* 결과 */
  .result{ background:#fff; border-radius:16px; padding:18px; text-align:center; margin-top:16px; }
  .result h4{ color:#555; font-size:12px; margin:2px 0 8px; font-weight:700; }
  #barcode{ max-width:100%; }
  #qr{ display:inline-block; margin-bottom:6px; }
  .empty{ color:var(--mut); text-align:center; margin-top:28px; font-size:14px; line-height:1.6; }

  /* 카메라 오버레이 */
  .cam{ position:fixed; inset:0; background:#000; z-index:9; display:none; flex-direction:column; }
  .cam.on{ display:flex; }
  .cam video{ flex:1; width:100%; object-fit:cover; }
  .cam .box{ position:absolute; left:8%; right:8%; top:44%; height:12%; border:2px solid var(--ac); border-radius:10px;
             box-shadow:0 0 0 2000px rgba(0,0,0,.45); }
  .cam .bar{ padding:14px 16px calc(14px + env(safe-area-inset-bottom)); background:#000; }
  .cam .msg{ color:#cfe4ff; text-align:center; font-size:14px; min-height:20px; margin-bottom:8px; }
  .hide{ display:none !important; }
</style>
</head>
<body>
<header><b>📷 코드 → QR/바코드</b><span class="v">v11</span><span id="dot" class="dot"></span></header>

<div class="wrap">
  <label class="cap">번호 (직접 입력 또는 카메라 스캔) — 입력하면 아래 코드가 바로 생성돼요</label>
  <input id="code" type="text" placeholder="예: 78-RCRT9-1-101" autocomplete="off" oninput="render()">

  <button onclick="openCam()">📷  카메라로 스캔</button>

  <div id="out"></div>
  <div class="pair" id="acts" style="display:none">
    <button class="sub" onclick="copyCode()">📋 번호 복사</button>
    <button class="sub" onclick="clearCode()">✕ 지우기</button>
  </div>

  <div class="empty" id="empty">위 칸에 번호를 입력하거나<br>📷 카메라로 스캔하면<br>QR·바코드가 여기 나와요</div>
</div>

<!-- 카메라 오버레이 -->
<div class="cam" id="cam">
  <video id="video" playsinline muted></video>
  <div class="box"></div>
  <div class="bar">
    <div class="msg" id="msg">번호를 네모 안에 맞추세요</div>
    <div class="pair">
      <button onclick="scanOnce()">스캔</button>
      <button class="sub" onclick="closeCam()">닫기</button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"></script>
<script src="https://cdn.jsdelivr.net/gh/davidshimjs/qrcodejs/qrcode.min.js"></script>
<script>
const $=id=>document.getElementById(id);
let worker=null, ready=false, stream=null;

// ---------- 코드 생성 (입력 즉시) ----------
function render(){
  const v=$('code').value.trim().toUpperCase();
  const out=$('out'), acts=$('acts'), empty=$('empty');
  if(!v){ out.innerHTML=''; acts.style.display='none'; empty.style.display='block'; return; }
  empty.style.display='none'; acts.style.display='flex';
  out.innerHTML='<div class="result"><h4>바코드 (CODE128)</h4><svg id="barcode"></svg>'
              + '<h4 style="margin-top:14px">QR 코드</h4><div id="qr"></div></div>';
  if(typeof JsBarcode!=='undefined'){ try{ JsBarcode('#barcode', v, {format:'CODE128',displayValue:true,height:90,fontSize:18,margin:6,width:2.2}); }catch(e){} }
  if(typeof QRCode!=='undefined'){ try{ new QRCode($('qr'), {text:v, width:180, height:180, correctLevel:QRCode.CorrectLevel.M}); }catch(e){} }
}
function copyCode(){ const v=$('code').value.trim(); if(navigator.clipboard) navigator.clipboard.writeText(v); }
function clearCode(){ $('code').value=''; render(); $('code').focus(); }

// ---------- OCR 엔진 (최초 1회 로딩) ----------
window.addEventListener('load', initEngine);
async function initEngine(){
  if(typeof Tesseract==='undefined'){ $('dot').className='dot err'; return; }
  try{
    worker = await Tesseract.createWorker('eng');
    await worker.setParameters({ tessedit_char_whitelist:'0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ-' });
    ready=true; $('dot').className='dot ok';
  }catch(e){ $('dot').className='dot err'; }
}

// ---------- 카메라 ----------
async function openCam(){
  $('cam').classList.add('on');
  $('msg').textContent = ready ? '번호를 네모 안에 맞추고 "스캔"' : '인식 엔진 준비 중…';
  try{
    stream = await navigator.mediaDevices.getUserMedia({ video:{ facingMode:'environment' } });
    $('video').srcObject=stream; await $('video').play();
  }catch(e){ $('msg').textContent='카메라를 못 열었어요 ('+(e.name||e)+')'; }
}
function closeCam(){ $('cam').classList.remove('on'); if(stream){ stream.getTracks().forEach(t=>t.stop()); stream=null; } }

function grab(){
  const v=$('video'), vw=v.videoWidth, vh=v.videoHeight; if(!vw||!vh) return null;
  const bx=.08*vw, bw=.84*vw, by=.44*vh, bh=.12*vh, sc=3;
  const c=document.createElement('canvas'); c.width=bw*sc; c.height=bh*sc;
  c.getContext('2d').drawImage(v, bx,by,bw,bh, 0,0, c.width,c.height); return c;
}
async function scanOnce(){
  if(!ready){ $('msg').textContent='엔진이 아직 준비 중이에요. 잠시 뒤 다시.'; return; }
  const f=grab(); if(!f){ $('msg').textContent='카메라 준비 중…'; return; }
  $('msg').textContent='인식 중…';
  try{
    const { data } = await worker.recognize(f);
    const hit=pick(data.text);
    if(hit){ $('code').value=hit; render(); closeCam(); }
    else $('msg').textContent='못 읽었어요. 더 가까이·또렷하게 다시. 안 되면 닫고 직접 입력하세요.';
  }catch(e){ $('msg').textContent='인식 오류. 닫고 직접 입력하세요.'; }
}
function pick(text){
  const up=(text||'').toUpperCase();
  const seg=(up.match(/[0-9A-Z]+(?:-[0-9A-Z]+){1,}/g)||[]);          // 하이픈 포함 코드 우선
  if(seg.length) return seg.sort((a,b)=>b.length-a.length)[0];
  const toks=(up.match(/[0-9A-Z]{4,}/g)||[]);                         // 없으면 4자 이상 덩어리
  return toks.length ? toks.sort((a,b)=>b.length-a.length)[0] : '';
}
</script>
</body>
</html>

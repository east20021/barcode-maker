<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0f1115">
<title>코드 → QR/바코드</title>
<style>
  :root{ --bg:#0f1115; --card:#1a1e27; --line:#2a3040; --fg:#e8ecf4; --mut:#8a93a6; --ac:#4ea1ff; }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body{ margin:0; background:var(--bg); color:var(--fg); font-family:-apple-system,"맑은 고딕",system-ui,sans-serif;
        padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom); }
  header{ display:flex; align-items:center; gap:8px; padding:13px 16px; border-bottom:1px solid var(--line); }
  header b{ font-size:16px; } header .v{ color:var(--mut); font-size:11px; margin-left:auto; }
  .wrap{ max-width:520px; margin:0 auto; padding:16px; }
  label.cap{ display:block; color:var(--mut); font-size:13px; margin:2px 2px 6px; }
  #code{ width:100%; font-size:27px; font-weight:800; letter-spacing:1px; text-align:center; text-transform:uppercase;
         background:var(--card); border:2px solid var(--ac); color:var(--fg); border-radius:14px; padding:18px 10px; }
  #code::placeholder{ color:#5a6273; font-weight:500; letter-spacing:0; text-transform:none; font-size:16px; }
  button{ font:inherit; border:0; border-radius:14px; font-weight:800; background:var(--ac); color:#031024;
          padding:16px; width:100%; display:flex; align-items:center; justify-content:center; gap:8px; margin-top:12px; }
  button:active{ transform:scale(.98); }
  button.sub{ background:var(--card); color:var(--fg); border:1px solid var(--line); font-weight:600; }
  .pair{ display:flex; gap:10px; } .pair>*{ flex:1; }
  .tip{ background:var(--card); border:1px solid var(--line); border-radius:12px; padding:13px 14px; margin-top:14px;
        color:var(--mut); font-size:13px; line-height:1.65; }
  .tip b{ color:var(--fg); }
  .result{ background:#fff; border-radius:16px; padding:18px; text-align:center; margin-top:16px; }
  .result h4{ color:#555; font-size:12px; margin:2px 0 8px; font-weight:700; }
  #barcode{ max-width:100%; } #qr{ display:inline-block; margin-bottom:6px; }
</style>
</head>
<body>
<header><b>📷 코드 → QR/바코드</b><span class="v">v13</span></header>

<div class="wrap">
  <label class="cap">번호 입력 · 붙여넣기 · 또는 이 칸을 꾹 눌러 "텍스트 스캔"</label>
  <input id="code" type="text" placeholder="예: 78-RCRT9-1-101" autocomplete="off" autocapitalize="characters" oninput="render()">

  <button class="sub" onclick="paste()">📋  붙여넣기 (사진에서 복사한 번호)</button>

  <div id="out"></div>
  <div class="pair" id="acts" style="display:none">
    <button class="sub" onclick="copyCode()">📋 번호 복사</button>
    <button class="sub" onclick="clearCode()">✕ 지우기</button>
  </div>

  <div class="tip">
    💡 <b>제일 정확한 방법 (아이폰 기본 기능)</b><br>
    위 입력칸을 <b>꾹 누르면</b> → <b>"텍스트 스캔"</b> 뜸 → 카메라로 PDA 번호를 비추면 <b>글자가 바로 입력</b>돼요. (애플 인식이라 정확)<br>
    또는 사진에서 번호 복사 → <b>📋 붙여넣기</b>.
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"></script>
<script src="https://cdn.jsdelivr.net/gh/davidshimjs/qrcodejs/qrcode.min.js"></script>
<script>
const $=id=>document.getElementById(id);

function render(){
  const v=$('code').value.trim().toUpperCase();
  const out=$('out'), acts=$('acts');
  if(!v){ out.innerHTML=''; acts.style.display='none'; return; }
  acts.style.display='flex';
  out.innerHTML='<div class="result"><h4>바코드 (CODE128)</h4><svg id="barcode"></svg>'
              + '<h4 style="margin-top:14px">QR 코드</h4><div id="qr"></div></div>';
  if(typeof JsBarcode!=='undefined'){ try{ JsBarcode('#barcode', v, {format:'CODE128',displayValue:true,height:90,fontSize:18,margin:6,width:2.2}); }catch(e){} }
  if(typeof QRCode!=='undefined'){ try{ new QRCode($('qr'), {text:v, width:180, height:180, correctLevel:QRCode.CorrectLevel.M}); }catch(e){} }
}
async function paste(){
  try{
    const t=await navigator.clipboard.readText();
    if(t){ $('code').value=t.trim(); render(); }
    else alert('클립보드가 비어 있어요. 먼저 사진에서 번호를 복사하세요.');
  }catch(e){
    alert('붙여넣기 권한이 막혔어요. 입력칸을 꾹 눌러 "붙여넣기"를 쓰세요.');
  }
}
function copyCode(){ const v=$('code').value.trim(); if(navigator.clipboard) navigator.clipboard.writeText(v); }
function clearCode(){ $('code').value=''; render(); $('code').focus(); }
</script>
</body>
</html>
